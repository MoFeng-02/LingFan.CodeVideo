<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Code Video · 实时预览</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 16px;
        box-sizing: border-box;
        background: #101014;
        color: #d8d8e0;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      }
      h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
        color: #9aa0ff;
      }
      canvas {
        max-width: 100%;
        height: auto;
        border: 1px solid #2a2a35;
        border-radius: 8px;
        background: #000;
      }
      #hud {
        font-size: 13px;
        color: #8a8a99;
        font-variant-numeric: tabular-nums;
        min-height: 1.2em;
        text-align: center;
        max-width: 80vw;
      }
      button {
        padding: 8px 22px;
        font-size: 14px;
        border: 1px solid #3a3a4a;
        border-radius: 6px;
        background: #1c1c26;
        color: #d8d8e0;
        cursor: pointer;
      }
      button:hover {
        background: #26263a;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #row {
        display: flex;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Code Video · 实时预览</h1>
    <canvas id="stage" width="1280" height="720"></canvas>
    <div id="hud">按「播放」开始（音频需用户手势解锁）</div>
    <div id="row">
      <button id="play">播放</button>
      <button id="export">导出 MP4</button>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
